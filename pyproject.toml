dependencies = [
    "fastapi==0.115.14",
    "PyJWT==2.10.1",
    "pydantic==2.11.9",
    "pydantic-settings==2.10.1",
    "SQLAlchemy==2.0.43",
    "GeoAlchemy2==0.20.0",
    "psycopg2-binary==2.9.12",
    "redis==6.4.0",
    "rq==2.1.0",
    "httpx==0.28.1",
    "requests==2.32.5",
